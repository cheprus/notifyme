[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NotifyMe"
version = "1.0.0"
description = "macOS menu bar app for upcoming calendar events with reminders"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Alexey Chepurnykh"}]
dependencies = [
    "rumps",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-EventKit",
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-AVFoundation",
    "dateparser",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pytest",
    "ruff",
    "mypy",
    "create-dmg",
]

[project.scripts]
notifyme = "app:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "app",
    "status_bar",
    "menu_item_view",
    "dialogs",
    "alarm_utils",
    "event_card",
    "add_event_window",
    "calendar_service",
    "calendar_icon",
    "ui_utils",
    "time_utils",
    "color_utils",
    "clipboard_utils",
    "audio_output",
    "hotkeys",
    "menu_builders",
    "menu_alarm",
    "config",
    "state_manager",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "N802",
    "N803",
    "N815",
    "N816",
    "SIM105",
    "SIM108",
    "SIM103",
    "E701",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"src/status_bar.py" = ["N802", "N803", "N815"]
"src/dialogs.py" = ["N802", "N803", "N815"]
"src/alarm_utils.py" = ["N802", "N803", "N815"]
"src/menu_builders.py" = ["N802", "N803"]
"src/menu_alarm.py" = ["N802", "N803"]
"src/event_card.py" = ["N802", "N803"]
"src/menu_item_view.py" = ["N802", "N803"]
"src/add_event_window.py" = ["N802", "N803"]
"src/hotkeys.py" = ["N802", "N803"]
"src/calendar_icon.py" = ["N802"]
"src/audio_output.py" = ["N802", "N816"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
